# Render.com deployment config
services:
  - type: web
    name: campus-pollen-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GOOGLE_POLLEN_API_KEY
        sync: false
