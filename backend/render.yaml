# Render.com deployment config
services:
  - type: web
    name: campus-pollen-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GOOGLE_POLLEN_API_KEY
        sync: false
