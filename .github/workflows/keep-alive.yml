# Render's free plan sleeps the backend after 15 idle minutes, and the next
# visitor waits ~30-60 s for it to boot. A periodic ping keeps it awake.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://campus-pollen-api.onrender.com/api/health
